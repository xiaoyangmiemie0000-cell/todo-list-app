<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项应用</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 我的待办事项</h1>
            <p class="subtitle">高效管理你的日常任务</p>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="输入新的待办事项..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">添加</button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="active">进行中</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>
        </div>

        <div class="stats">
            <span>总数: <span id="totalCount">0</span></span>
            <span>已完成: <span id="completedCount">0</span></span>
            <span>进行中: <span id="activeCount">0</span></span>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>🎉 没有待办事项！放松一下吧</p>
        </div>

        <button id="clearBtn" class="clear-btn">清空已完成的项目</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
